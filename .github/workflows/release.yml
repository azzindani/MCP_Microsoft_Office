name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_image:
        description: "Also build and push the GHCR container image"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ci:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    env:
      MCP_CONSTRAINED_MODE: "1"
      PYTHONPATH: "."

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"

      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - run: uv sync --all-packages --frozen

      - run: uv run python tests/create_fixtures.py

      - run: uv run ruff check .

      - run: uv run ruff format --check .

      - run: uv run pyright servers/ shared/

      - run: uv run python tests/verify_tool_docstrings.py

      - run: uv run python -m pytest tests/ -q --tb=short

  # Publishes ghcr.io/<owner>/mcp-microsoft-office:<version> + :latest. Uses
  # the shared composite action hosted in MCP_Math so build/push mechanics
  # stay in one place across all azzindani MCP_* repos.
  #
  # Opt-in, not automatic: a tag push cuts the GitHub Release only. The fleet
  # deploys from locally built images, so publishing a package on every tag
  # spends CI minutes on an artefact nothing pulls. To publish one, run this
  # workflow by hand against the tag with publish_image=true. `inputs` is null
  # on a push event, so the condition is false there without a second clause.
  docker:
    name: Publish Docker image (GHCR)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_image }}
    needs: ci
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Build and push
        uses: azzindani/MCP_Math/.github/actions/docker-ghcr-publish@main
        with:
          image-name: mcp-microsoft-office
          push: "true"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Create Release
    needs: ci
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      # `generate_release_notes` alone lists merged PRs, and this repo pushes
      # straight to main -- so v0.2.0's page was published with nothing on it
      # but a compare link. The commit subjects are the record here; write them.
      - name: Generate changelog
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | head -2 | tail -1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "${GITHUB_REF#refs/tags/}" ]; then
            LOG=$(git log --oneline --no-decorate | head -50)
          else
            LOG=$(git log --oneline --no-decorate "${PREV_TAG}..HEAD" | head -50)
          fi
          {
            echo "## What's Changed"
            echo ""
            echo "$LOG" | sed 's/^/- /'
          } > /tmp/changelog.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: ${{ steps.tag.outputs.version }}
          body_path: /tmp/changelog.txt
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.version, '-rc') || contains(steps.tag.outputs.version, '-beta') || contains(steps.tag.outputs.version, '-alpha') }}
          generate_release_notes: true
