name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: office-mcp-linux.tar.gz
          - os: windows-latest
            artifact: office-mcp-windows-x64.zip
          - os: macos-latest
            artifact: office-mcp-macos.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages --frozen

      - name: Build Linux/macOS archive
        if: runner.os != 'Windows'
        run: |
          tar --exclude='.git' --exclude='.venv' --exclude='__pycache__' \
              --exclude='*.pyc' --exclude='.mcp_versions' \
              -czf "$RUNNER_TEMP/${{ matrix.artifact }}" .
          mv "$RUNNER_TEMP/${{ matrix.artifact }}" "${{ matrix.artifact }}"

      - name: Build Windows archive
        if: runner.os == 'Windows'
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "${{ matrix.artifact }}"
          $src = Get-Location
          Set-Location ..
          Compress-Archive -Path (Split-Path $src -Leaf) -DestinationPath $dest -Force
          Set-Location $src
          Move-Item $dest "${{ matrix.artifact }}"
        shell: pwsh

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
