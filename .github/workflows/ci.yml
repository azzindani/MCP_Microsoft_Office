name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    # No MCP_CONSTRAINED_MODE here: this is the normal-limits run. The
    # constrained job below covers the other branch.
    env:
      PYTHONPATH: "."

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"

      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install dependencies
        run: uv sync --all-packages --frozen

      - name: Generate test fixtures
        run: uv run python tests/create_fixtures.py

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright servers/ shared/

      - name: Verify tool docstrings
        run: uv run python tests/verify_tool_docstrings.py

      - name: Run tests
        run: uv run python -m pytest tests/ -q --tb=short

  # ── Constrained mode (8 GB VRAM target) ─────────────────────────────
  # This workflow used to set MCP_CONSTRAINED_MODE on the matrix job above and
  # have no job without it, so every run tested the constrained branch of every
  # get_max_* helper and never the normal one. The matrix now runs at normal
  # limits and this job covers the other half.
  constrained:
    name: Constrained mode (ubuntu)
    runs-on: ubuntu-22.04

    env:
      MCP_CONSTRAINED_MODE: "1"
      PYTHONPATH: "."

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-packages --frozen

      - name: Generate test fixtures
        run: uv run python tests/create_fixtures.py

      - name: Run tests in constrained mode
        run: uv run python -m pytest tests/ -q --tb=short

  # The suite above never starts a server (STANDARDS.md keeps pytest offline),
  # so nothing until now proved that what we ship answers a request. This job
  # also builds that thing on the way in -- `docker compose up --build` from
  # the same context and Dockerfile a release would use. Shared action, because
  # this is identical in all seven repos and drift between copies is the bug
  # that keeps costing rounds.
  #
  # That is why there is no separate build-only job any more. One existed, and
  # it could not fail in any case where this job does not fail first; all it
  # added was a second full image build on every push -- and this repo's image
  # is one of the expensive ones.
  e2e:
    name: End-to-end (container)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test every tool over HTTP
        uses: azzindani/MCP_Math/.github/actions/e2e-smoke@main
        with:
          port: "8830"
          key-env: OFFICE_API_KEY
          # Deliberately not the deployed hostname. Rebinding protection is off,
          # so any Host must be accepted; an arbitrary one proves exactly that
          # and keeps the real domain out of one more file.
          public-host: office.example.com
          mcp-path: /docx-basic/mcp
          health-timeout: "180"
          create-dirs: "oauth-state"
          shared-dir: shared-files
