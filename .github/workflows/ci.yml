name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    env:
      MCP_CONSTRAINED_MODE: "1"
      PYTHONPATH: "."

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install dependencies
        run: uv sync --all-packages --frozen

      - name: Generate test fixtures
        run: uv run python tests/create_fixtures.py

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright servers/ shared/

      - name: Verify tool docstrings
        run: uv run python tests/verify_tool_docstrings.py

      - name: Run tests
        run: uv run python -m pytest tests/ -q --tb=short

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        uses: azzindani/MCP_Math/.github/actions/docker-ghcr-publish@main
        with:
          image-name: mcp-microsoft-office
          push: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
