# ─────────────────────────────────────────────────────────────────────────────
# mcp-microsoft-office — local & VPS-friendly compose stack.
#
# One image (see Dockerfile), one service per sub-server (11 total),
# selected via SERVER_MODULE. All share one bearer-auth token set
# (OFFICE_TOKENS_FILE / OFFICE_TOKENS / OFFICE_API_KEY) since they're one
# logical deployment unit.
#
# Quick start (open mode, no auth — localhost/private network only):
#   docker compose up -d --build
#   curl http://localhost:8830/health   # docx_basic
#
# With auth: cp tokens.example.json tokens.json && docker compose up -d --build
# ─────────────────────────────────────────────────────────────────────────────
x-office-common: &office-common
  build:
    context: .
  image: ${OFFICE_IMAGE:-mcp-microsoft-office:latest}
  restart: unless-stopped
  environment: &office-common-env
    OFFICE_TOKENS_FILE: ${OFFICE_TOKENS_FILE:-}
    OFFICE_TOKENS: ${OFFICE_TOKENS:-}
    OFFICE_API_KEY: ${OFFICE_API_KEY:-}
  mem_limit: ${OFFICE_MEM_LIMIT:-1g}
  volumes:
    - ./tokens.json:/home/app/tokens.json:ro

services:
  docx-basic:
    <<: *office-common
    container_name: mcp-docx-basic
    ports: ["${OFFICE_DOCX_BASIC_HOST_PORT:-8830}:8830"]
    environment:
      <<: *office-common-env
      SERVER_MODULE: servers/docx_basic/docx_basic/server.py
      OFFICE_DOCX_BASIC_TRANSPORT: http
      OFFICE_DOCX_BASIC_HOST: 0.0.0.0
      OFFICE_DOCX_BASIC_PORT: 8830
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['OFFICE_DOCX_BASIC_PORT']+'/health',timeout=3)\""]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  docx-tables:
    <<: *office-common
    container_name: mcp-docx-tables
    ports: ["${OFFICE_DOCX_TABLES_HOST_PORT:-8831}:8831"]
