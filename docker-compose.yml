# ─────────────────────────────────────────────────────────────────────────────
# mcp-microsoft-office — local & VPS-friendly compose stack.
#
# One image, ONE container: unified_server.py mounts all 11 sub-servers as
# separate MCP endpoints on one port, so python-docx/openpyxl/python-pptx
# load once instead of eleven times. All 11 share one bearer-auth token set
# (OFFICE_TOKENS_FILE / OFFICE_TOKENS / OFFICE_API_KEY) since they're one
# logical deployment unit.
#
# Quick start (open mode, no auth — localhost/private network only):
#   docker compose up -d --build
#   curl http://localhost:8830/health              # aggregate
#   curl http://localhost:8830/docx-basic/health    # per sub-server
#
# With auth: cp tokens.example.json tokens.json && docker compose up -d --build
# ─────────────────────────────────────────────────────────────────────────────
services:
  office:
    build:
      context: .
    image: ${OFFICE_IMAGE:-mcp-microsoft-office:latest}
    container_name: mcp-office
    restart: unless-stopped
    ports:
      - "${OFFICE_HOST_PORT:-8830}:8830"
    environment:
      OFFICE_HOST: 0.0.0.0
      OFFICE_PORT: 8830
      OFFICE_TOKENS_FILE: ${OFFICE_TOKENS_FILE:-}
      OFFICE_TOKENS: ${OFFICE_TOKENS:-}
      OFFICE_API_KEY: ${OFFICE_API_KEY:-}
      # OAuth 2.0 bridge for clients that require it (e.g. claude.ai's Custom
      # Connector) instead of a plain bearer header — see shared/oauth_bridge.py.
      # One state dir per sub-server (each is its own claude.ai connector, at
      # its own /docx-basic, /xlsx-basic, ... path) even though it's one
      # process/port. Only takes effect when a token source above is set;
      # harmless otherwise.
      # OFFICE_PUBLIC_URL is the public HTTPS origin (no trailing slash, no
      # tier suffix) this service is reachable at through the reverse proxy —
      # each server.py appends its own /docx-basic, /xlsx-basic, etc.
      # REQUIRED for OAuth discovery to work once mounted behind a path
      # prefix: without it, both the 401's WWW-Authenticate hint AND the raw
      # SDK's own /.well-known/oauth-protected-resource route fall back to
      # the internal bind address, which claude.ai can't reach.
      OFFICE_PUBLIC_URL: ${OFFICE_PUBLIC_URL:-}
      OFFICE_DOCX_BASIC_OAUTH_STATE_DIR: /home/app/.oauth-state/docx-basic
      OFFICE_DOCX_TABLES_OAUTH_STATE_DIR: /home/app/.oauth-state/docx-tables
      OFFICE_DOCX_LAYOUT_OAUTH_STATE_DIR: /home/app/.oauth-state/docx-layout
      OFFICE_DOCX_NEW_OAUTH_STATE_DIR: /home/app/.oauth-state/docx-new
      OFFICE_XLSX_BASIC_OAUTH_STATE_DIR: /home/app/.oauth-state/xlsx-basic
      OFFICE_XLSX_FORMULAS_OAUTH_STATE_DIR: /home/app/.oauth-state/xlsx-formulas
      OFFICE_XLSX_CHARTS_OAUTH_STATE_DIR: /home/app/.oauth-state/xlsx-charts
      OFFICE_XLSX_NEW_OAUTH_STATE_DIR: /home/app/.oauth-state/xlsx-new
      OFFICE_PPTX_BASIC_OAUTH_STATE_DIR: /home/app/.oauth-state/pptx-basic
      OFFICE_PPTX_DESIGN_OAUTH_STATE_DIR: /home/app/.oauth-state/pptx-design
      OFFICE_PPTX_NEW_OAUTH_STATE_DIR: /home/app/.oauth-state/pptx-new
      OFFICE_OAUTH_CLIENT_ID: ${OFFICE_OAUTH_CLIENT_ID:-}
      OFFICE_OAUTH_CLIENT_SECRET: ${OFFICE_OAUTH_CLIENT_SECRET:-}
      # Hybrid file exchange — see README "Hybrid local + remote file handling".
      # MCP_OUTPUT_DIR doubles as the in-container mount point below so the
      # two can never drift apart: point MCP_SHARED_DIR at a host directory
      # your file server also serves, set MCP_PUBLIC_BASE_URL to that
      # directory's public URL, and every generated .docx/.xlsx/.pptx/.pdf
      # comes back with a `public_url` the caller can actually open. Without
      # this, documents land in ~/Downloads *inside the container* — a black
      # hole for any remote caller.
      MCP_OUTPUT_DIR: ${MCP_OUTPUT_DIR:-/files}
      MCP_PUBLIC_BASE_URL: ${MCP_PUBLIC_BASE_URL:-}
      # Off by default. With it on, any file path argument may be an http(s)
      # URL. Hosts resolving to loopback/link-local/private addresses are
      # refused unless MCP_FETCH_ALLOW_PRIVATE=1 — don't relax that on a
      # publicly reachable deployment.
      MCP_FETCH_URLS: ${MCP_FETCH_URLS:-0}
      MCP_FETCH_ALLOW_PRIVATE: ${MCP_FETCH_ALLOW_PRIVATE:-0}
      MCP_MAX_FETCH_MB: ${MCP_MAX_FETCH_MB:-100}
    mem_limit: ${OFFICE_MEM_LIMIT:-512m}
    volumes:
      - ./tokens.json:/home/app/tokens.json:ro
      # Shared output directory (see MCP_OUTPUT_DIR above). The container
      # writes as uid/gid 999 (`app`), so `chown 999:999` the host directory
      # before first run — left root-owned, every generated document fails
      # with EACCES, same gotcha as oauth-state below.
      - ${MCP_SHARED_DIR:-./shared-files}:${MCP_OUTPUT_DIR:-/files}
      # Persists OAuth-issued access/refresh tokens (one subdir per
      # sub-server) so a container restart doesn't force claude.ai to
      # reauthorize. `mkdir -p oauth-state && chown 999:999 oauth-state`
      # before first run — left root-owned, the container's non-root user
      # can't write to it.
      - ./oauth-state:/home/app/.oauth-state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8830/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
