# ─────────────────────────────────────────────────────────────────────────────
# mcp-microsoft-office — local & VPS-friendly compose stack.
#
# One image, ONE container: unified_server.py mounts all 11 sub-servers as
# separate MCP endpoints on one port, so python-docx/openpyxl/python-pptx
# load once instead of eleven times. All 11 share one bearer-auth token set
# (OFFICE_TOKENS_FILE / OFFICE_TOKENS / OFFICE_API_KEY) since they're one
# logical deployment unit.
#
# Quick start (open mode, no auth — localhost/private network only):
#   docker compose up -d --build
#   curl http://localhost:8830/health              # aggregate
#   curl http://localhost:8830/docx-basic/health    # per sub-server
#
# With auth: cp tokens.example.json tokens.json && docker compose up -d --build
# ─────────────────────────────────────────────────────────────────────────────
services:
  office:
    build:
      context: .
    image: ${OFFICE_IMAGE:-mcp-microsoft-office:latest}
    container_name: mcp-office
    restart: unless-stopped
    ports:
      - "${OFFICE_HOST_PORT:-8830}:8830"
    environment:
      OFFICE_HOST: 0.0.0.0
      OFFICE_PORT: 8830
      OFFICE_TOKENS_FILE: ${OFFICE_TOKENS_FILE:-}
      OFFICE_TOKENS: ${OFFICE_TOKENS:-}
      OFFICE_API_KEY: ${OFFICE_API_KEY:-}
    mem_limit: ${OFFICE_MEM_LIMIT:-512m}
    volumes:
      - ./tokens.json:/home/app/tokens.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8830/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
