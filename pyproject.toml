[project]
name = "office-mcp"
version = "0.1.2"
description = "MCP servers for Microsoft Office file formats"
requires-python = "==3.14.*"
readme = "README.md"
license = { text = "MIT" }

[tool.uv.workspace]
members = [
    "shared",
    "servers/docx_basic",
    "servers/docx_tables",
    "servers/docx_layout",
    "servers/docx_new",
    "servers/xlsx_basic",
    "servers/xlsx_formulas",
    "servers/xlsx_charts",
    "servers/xlsx_new",
    "servers/pptx_basic",
    "servers/pptx_design",
    "servers/pptx_new",
]

[tool.uv.sources]
shared = { workspace = true }

[tool.uv]
required-version = ">=0.5"

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = ["*.ipynb"]

[tool.ruff.format]
# Lint shared/, never rewrite it. These modules are meant to stay byte-identical
# with their siblings in the other repos, and the formatter forks them silently.
# MCP_File_System lints at line-length 100 and the rest at 120, which is how
# shared/oauth_bridge.py ended up 77 lines different from its twin by pure
# reflow, with nothing in the diff to say no logic had changed -- and how
# shared/counts.py forked on a single f-string within a day of being written.
# CI caught the second one: `ruff format --check` wanted to rewrite the file
# whose whole purpose is being the one copy.
exclude = ["shared/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "shared",
    "docx_basic", "docx_tables", "docx_layout", "docx_new",
    "xlsx_basic", "xlsx_formulas", "xlsx_charts", "xlsx_new",
    "pptx_basic", "pptx_design", "pptx_new",
]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
extraPaths = ["shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.9",
]
