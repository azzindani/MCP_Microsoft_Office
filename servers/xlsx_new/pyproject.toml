[project]
name = "xlsx-new"
version = "0.1.0"
description = "MCP server — create new Excel workbooks from scratch"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "openpyxl>=3.1.0",
    "shared",
]

[project.scripts]
xlsx-new = "xlsx_new.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xlsx_new"]
