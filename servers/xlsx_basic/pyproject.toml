[project]
name = "xlsx-basic"
version = "0.1.0"
description = "MCP server — Excel spreadsheet basic operations"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "openpyxl>=3.1.0",
    "shared",
]

[project.scripts]
xlsx-basic = "xlsx_basic.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xlsx_basic"]
