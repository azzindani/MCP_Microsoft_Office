[project]
name = "docx-layout"
version = "0.1.0"
description = "MCP server — Word document layout and styling"
requires-python = "==3.12.*"
dependencies = [
    "mcp[cli]>=1.2.0",
    "python-docx>=1.1.0",
    "docx2pdf>=0.1.8",
    "shared",
]

[project.scripts]
docx-layout = "docx_layout.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docx_layout"]
