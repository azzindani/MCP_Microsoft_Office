[project]
name = "xlsx-formulas"
version = "0.1.0"
description = "MCP server — Excel formulas and validation"
requires-python = "==3.12.*"
dependencies = [
    "mcp[cli]>=1.2.0,<2.0",
    "openpyxl>=3.1.0",
    "shared",
]

[project.scripts]
xlsx-formulas = "xlsx_formulas.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xlsx_formulas"]
