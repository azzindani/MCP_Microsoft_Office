[project]
name = "pptx-design"
version = "0.1.0"
description = "MCP server — PowerPoint design and styling"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "python-pptx>=0.6.23",
    "docx2pdf>=0.1.8",
    "shared",
]

[project.scripts]
pptx-design = "pptx_design.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pptx_design"]
