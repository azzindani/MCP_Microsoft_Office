[project]
name = "pptx-basic"
version = "0.1.0"
description = "MCP server — PowerPoint basic operations"
requires-python = "==3.14.*"
dependencies = [
    "mcp[cli]>=1.2.0,<2.0",
    "python-pptx>=0.6.23",
    "shared",
]

[project.scripts]
pptx-basic = "pptx_basic.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pptx_basic"]
