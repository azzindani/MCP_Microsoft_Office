[project]
name = "xlsx-charts"
version = "0.1.0"
description = "MCP server — Excel charts and pivot tables"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.2.0",
    "shared",
]

[project.scripts]
xlsx-charts = "xlsx_charts.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xlsx_charts"]
