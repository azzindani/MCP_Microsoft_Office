[project]
name = "docx-new"
version = "0.1.0"
description = "MCP server — create new Word documents from scratch"
requires-python = "==3.12.*"
dependencies = [
    "mcp[cli]>=1.2.0,<2.0",
    "python-docx>=1.1.0",
    "docxedit>=1.2.0",
    "shared",
]

[project.scripts]
docx-new = "docx_new.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docx_new"]
