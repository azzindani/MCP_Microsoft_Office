[project]
name = "docx-basic"
version = "0.1.0"
description = "MCP server — Word document basic operations"
requires-python = "==3.12.*"
dependencies = [
    "mcp[cli]>=1.2.0",
    "python-docx>=1.1.0",
    "docxedit>=1.2.0",
    "shared",
]

[project.scripts]
docx-basic = "docx_basic.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docx_basic"]
