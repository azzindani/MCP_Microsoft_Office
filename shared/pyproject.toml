[project]
name = "shared"
version = "0.1.0"
description = "Shared utilities for office-mcp servers"
requires-python = ">=3.11"
dependencies = [
    "json5>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["*.py"]

[tool.hatch.build.targets.wheel]
include = ["*.py"]
