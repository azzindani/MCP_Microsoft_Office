[project]
name = "shared"
version = "0.1.0"
description = "Shared utilities for office-mcp servers"
requires-python = "==3.14.*"
dependencies = [
    "json5>=0.9.0",
    "mcp[cli]>=1.2.0,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
